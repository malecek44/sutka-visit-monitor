name: Sutka visitor monitor

on:
  schedule:
    - cron: "*/10 6-21 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run script
        run: python test_browser.py

            - name: Commit CSV if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f data.csv ]; then
            git add data.csv
            git diff --cached --quiet || git commit -m "Update visitor data"
            git push
          else
            echo "data.csv zatím neexistuje – není co commitnout"
          fi
